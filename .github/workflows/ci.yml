name: CI

on:
  push:
    branches: [main, "dev/*", "feat-*", "fix-*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Backend pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Run pytest
        run: |
          cd backend
          pytest -q
        # 测试用 TEST_ENV 自带随机密钥（secrets.token_urlsafe），
        # 不依赖 GitHub Secrets，CI 无需配置任何 secret。

  build-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install & build frontend
        run: |
          cd frontend
          npm ci || npm install
          npm run build

  docker:
    name: Docker images & compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose config
        run: docker compose config -q
      - name: Build backend image
        run: docker build -t gnotes-backend ./backend
      - name: Build nginx image
        run: docker build -t gnotes-nginx -f nginx/Dockerfile .
